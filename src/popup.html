<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>译页</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span>译</span>
          <i></i>
        </div>
        <div>
          <h1>译页</h1>
          <p>读懂，不打断阅读</p>
        </div>
        <span id="connectionBadge" class="connection-badge">未配置</span>
      </header>

      <section class="language-flow" aria-label="翻译语言">
        <label>
          <span>原文</span>
          <select id="sourceLanguage">
            <option value="auto">自动识别</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <button id="swapLanguages" class="swap" type="button" aria-label="交换语言">⇄</button>
        <label>
          <span>译文</span>
          <select id="targetLanguage">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
      </section>

      <section class="actions">
        <button id="translatePage" class="primary-action" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 5h9M8.5 3v2m1 0c-.7 3.2-2.5 5.8-5.5 7.5m2.5-4c1.2 1.7 2.8 3 4.8 4M14 19l3.5-9 3.5 9m-5.8-3h4.6"/>
          </svg>
          <span>翻译当前网页</span>
        </button>
        <button id="restorePage" class="icon-action" type="button" title="还原原文" aria-label="还原原文">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8v5h5M5.2 12A7 7 0 1 0 7 7.2L4 10"/>
          </svg>
        </button>
      </section>

      <div class="feature-row">
        <button id="summarizePage" class="feature" type="button">
          <span class="feature-icon">≋</span>
          <span><strong>总结网页</strong><small>提炼重点内容</small></span>
        </button>
        <label class="feature toggle-feature">
          <span class="feature-icon">划</span>
          <span><strong>划词翻译</strong><small>选中文字即用</small></span>
          <input id="selectionEnabled" type="checkbox">
          <i class="toggle" aria-hidden="true"></i>
        </label>
      </div>

      <section id="summaryPanel" class="summary-panel" hidden>
        <div class="summary-head">
          <strong>网页摘要</strong>
          <button id="copySummary" type="button">复制</button>
        </div>
        <div id="summaryContent" class="summary-content"></div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <details id="settingsPanel" class="settings">
        <summary>
          <span>模型设置</span>
          <span id="modelSummary">配置你的 API</span>
        </summary>
        <div class="settings-body">
          <label>
            <span>API Key</span>
            <div class="password-field">
              <input id="apiKey" type="password" autocomplete="off" placeholder="sk-…" spellcheck="false">
              <button id="toggleApiKey" type="button" aria-label="显示 API Key">显示</button>
            </div>
          </label>
          <label>
            <span>Base URL</span>
            <input id="baseUrl" type="url" placeholder="https://api.openai.com/v1" spellcheck="false">
          </label>
          <label>
            <span>模型</span>
            <input id="model" type="text" placeholder="gpt-4o-mini" spellcheck="false">
          </label>
          <div class="settings-actions">
            <button id="testConnection" class="test-button" type="button">测试连接</button>
            <button id="saveSettings" class="save-button" type="button">保存设置</button>
          </div>
          <p class="privacy-note">配置只保存在此浏览器中，不会发送到其他服务。</p>
        </div>
      </details>
      <button id="openDashboard" class="dashboard-link" type="button">
        <span>打开管理面板</span>
        <span>历史与 Token 统计 ›</span>
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
